name: rapid-installer
base: core24
version: '1.0.0'
title: Rapid Installer
summary: Universal Package Installer, AppCleaner & Developer Toolchain Manager
description: |
  Rapid Installer is the ultimate macOS-style graphical desktop application manager and package installer for Linux.
  
  FOR BEGINNERS & ROOKIES:
  • 1-click double-click installation for .deb, .tar.gz, .zip, .AppImage, .rpm, .7z, and .tar.xz packages.
  • No terminal commands or complex sudo permissions needed—double click any app archive to install visually.
  • Sleek GTK3 App Dashboard to launch installed applications and clean up unused apps.

  FOR POWER USERS & DEVELOPERS:
  • AppCleaner-style deep uninstallation & disk space usage analytics.
  • Built-in Developer Runtime Manager: 1-click environment setup for Node.js (nvm), Bun, Rust (rustup), Python (pyenv), and Go (golang).
  • Zero-sudo user-space isolation (~/.local/opt/) & smart binary heuristic entry point ranking.

  Key Search Terms: installer, deb installer, appimage runner, package manager, software center, app uninstaller, appcleaner, nvm, bun, rustup, pyenv, go toolchain, double click install, linux app store.

license: MIT
contact: anilgudihindala@github.com
issues: https://github.com/anilgudihindala/RapidInstaller/issues
source-code: https://github.com/anilgudihindala/RapidInstaller
website: https://github.com/anilgudihindala/RapidInstaller

grade: stable
confinement: strict

lint:
  ignore:
    - library

apps:
  rapid-installer:
    command: bin/launcher.sh
    desktop: usr/share/applications/rapid-installer.desktop
    extensions: [gnome]
    plugs:
      - home
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11

parts:
  rapid-installer:
    plugin: dump
    source: .
    stage:
      - applaunch
      - assets
      - desktop
      - main.py
      - smart_installer.py
      - LICENSE
    stage-packages:
      - python3-gi
      - gir1.2-gtk-3.0
      - python3-pil
      - zenity
    override-build: |
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/bin
      mkdir -p $CRAFT_PART_INSTALL/usr/share/applications
      mkdir -p $CRAFT_PART_INSTALL/usr/share/rapid-installer
      cp -r applaunch main.py smart_installer.py $CRAFT_PART_INSTALL/usr/share/rapid-installer/
      cp desktop/rapid-installer.desktop $CRAFT_PART_INSTALL/usr/share/applications/
      printf '#!/bin/sh\nexec python3 $SNAP/usr/share/rapid-installer/main.py "$@"\n' > $CRAFT_PART_INSTALL/bin/launcher.sh
      chmod +x $CRAFT_PART_INSTALL/bin/launcher.sh
      chmod +x $CRAFT_PART_INSTALL/usr/share/rapid-installer/main.py
      chmod +x $CRAFT_PART_INSTALL/usr/share/rapid-installer/smart_installer.py
