name: rapid-installer
base: core24
version: '1.0.0'
title: Rapid Installer
summary: Universal Package Installer & GTK Application Manager for Linux
description: |
  Rapid Installer brings a macOS-style graphical desktop application manager and seamless package deployment experience to Ubuntu, Debian, and Linux platforms.
  Supports 1-click installation, dependency checks, and GUI desktop management for .deb, .tar.gz, .zip, .AppImage, and .rpm package archives.
  Search keywords: installer, deb installer, appimage, package manager, software center, tar.gz, zip installer.

grade: stable
confinement: strict

apps:
  rapid-installer:
    command: bin/launcher.sh
    desktop: usr/share/applications/rapid-installer.desktop
    extensions: [gnome]
    plugs:
      - home
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11

parts:
  rapid-installer:
    plugin: dump
    source: .
    stage-packages:
      - python3-gi
      - gir1.2-gtk-3.0
      - python3-pil
      - zenity
    override-build: |
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/bin
      mkdir -p $CRAFT_PART_INSTALL/usr/share/applications
      mkdir -p $CRAFT_PART_INSTALL/usr/share/rapid-installer
      cp -r applaunch main.py smart_installer.py $CRAFT_PART_INSTALL/usr/share/rapid-installer/
      cp desktop/rapid-installer.desktop $CRAFT_PART_INSTALL/usr/share/applications/
      printf '#!/bin/sh\nexec python3 $SNAP/usr/share/rapid-installer/main.py "$@"\n' > $CRAFT_PART_INSTALL/bin/launcher.sh
      chmod +x $CRAFT_PART_INSTALL/bin/launcher.sh
      chmod +x $CRAFT_PART_INSTALL/usr/share/rapid-installer/main.py
      chmod +x $CRAFT_PART_INSTALL/usr/share/rapid-installer/smart_installer.py
